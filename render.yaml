services:
  - type: web
    name: career-nexus-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_REASONING
        value: gemini-3.5-flash
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGIN
        sync: false
